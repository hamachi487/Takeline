# Builds the command-line `takeline` binary for Linux.
name: Build Linux CLI
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: ./build_linux.sh
      - name: Smoke test
        run: |
          ./dist/takeline --help
          ./dist/takeline --no-exiftool scan tests
      - name: Package
        run: tar -C dist -czf takeline-linux-${{ matrix.arch }}.tar.gz takeline
      - uses: actions/upload-artifact@v4
        with:
          name: takeline-linux-${{ matrix.arch }}
          path: takeline-linux-${{ matrix.arch }}.tar.gz
